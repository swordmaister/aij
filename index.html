<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D Brain Space - Live</title>
<style>
/* ── 基本設定（前回同様） ── */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  overflow: hidden; background: #050510;
  font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
  user-select: none; -webkit-user-select: none;
  touch-action: none; color: #fff;
  width: 100vw; height: 100vh; position: fixed;
}

/* ── 背景・3D空間 ── */
#stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
.star { position:absolute; background:#fff; border-radius:50%; }
#viewport { position:absolute; inset:0; perspective:1000px; z-index:1; }
#scene { position:absolute; inset:0; transform-style:preserve-3d; width:100%; height:100%; will-change:transform; }
#floor { position:absolute; width:0; height:0; left:50%; top:50%; transform-style:preserve-3d; }
#grid {
  position:absolute; left:-2000px; top:-2000px; width:4000px; height:4000px;
  background: linear-gradient(rgba(100,130,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(100,130,255,.07) 1px, transparent 1px);
  background-size: 100px 100px; transform: translateZ(-1px); pointer-events: none;
}

/* ── ノード（呼吸アニメーション追加） ── */
.memo-node {
  position: absolute; left: 0; top: 0; transform-style: preserve-3d;
  will-change: transform;
}
.memo-card {
  position: absolute; left: -50%; top: -50%;
  padding: 12px 18px; border-radius: 12px;
  font-size: 14px; font-weight: 700; color: #fff;
  white-space: nowrap; background: rgba(30,30,50, 0.8);
  box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  pointer-events: auto; cursor: pointer;
  border-left: 4px solid #fff;
  transition: box-shadow 0.3s ease; /* 呼吸用 */
}
.memo-node.selected .memo-card {
  box-shadow: 0 0 0 2px #fff, 0 12px 40px rgba(100,150,255,0.6);
  z-index: 100;
}

/* ── リンク（進化版） ── */
#svg-layer { position:absolute; inset:0; pointer-events:none; z-index:0; width:100%; height:100%; overflow:visible; }
.link-line {
  fill: none; transition: stroke 0.3s, stroke-width 0.3s;
  pointer-events: stroke; /* 線自体をタップ可能に */
  cursor: pointer;
}
/* 線の種類 */
.line-normal { stroke: rgba(100,200,255,0.6); stroke-width: 2; stroke-dasharray: 6, 4; }
.line-strong { stroke: rgba(0,255,255,0.9); stroke-width: 5; stroke-dasharray: none; }
.line-conflict { stroke: rgba(255,50,50,0.8); stroke-width: 2; stroke-dasharray: 2, 2; }

/* ── UIレイヤー（iPhone/スマホ最適化） ── */
#ui-layer { position:fixed; inset:0; pointer-events:none; z-index:200; }
#toolbar {
  position:absolute; bottom:calc(16px + env(safe-area-inset-bottom));
  left:50%; transform:translateX(-50%);
  display:flex; gap:8px; background:rgba(15,15,25,0.9);
  padding:8px; border-radius:24px; pointer-events:auto;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}
.tool-btn {
  background:transparent; border:none; color:rgba(255,255,255,0.5);
  padding:8px; border-radius:16px; font-size:10px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; min-width:54px;
}
.tool-btn.active { color:#fff; background:rgba(80,120,255,0.3); }
.tool-btn span { font-size:22px; }

#input-panel {
  position:absolute; bottom:calc(90px + env(safe-area-inset-bottom));
  left:50%; transform:translateX(-50%);
  display:flex; gap:8px; width:90%; max-width:360px;
  background:rgba(25,25,40,0.95); padding:10px; border-radius:18px;
  opacity:0; pointer-events:none; transition:0.2s;
}
#input-panel.show { opacity:1; pointer-events:auto; }
#memo-input { flex:1; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); color:#fff; padding:10px; border-radius:10px; outline:none; }
#add-btn { background:linear-gradient(135deg, #4facfe, #00f2fe); border:none; padding:0 15px; border-radius:10px; font-weight:bold; }

#hint {
  position:absolute; top:calc(20px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.6); padding:6px 16px; border-radius:20px; font-size:12px;
}
</style>
</head>
<body>

<div id="stars"></div>
<div id="viewport">
  <div id="scene">
    <div id="floor">
      <div id="grid"></div>
    </div>
  </div>
</div>
<svg id="svg-layer"></svg>

<div id="ui-layer">
  <div id="hint">📝 作成モード</div>
  <div id="input-panel">
    <input type="text" id="memo-input" placeholder="思考を置く..." maxlength="20" autocomplete="off">
    <button id="add-btn">追加</button>
  </div>
  <div id="toolbar">
    <button class="tool-btn active" data-mode="create"><span>📝</span>作成</button>
    <button class="tool-btn" data-mode="move"><span>✋</span>移動</button>
    <button class="tool-btn" data-mode="link"><span>🔗</span>接続</button>
  </div>
</div>

<script>
'use strict';

const S = {
  mode: 'create',
  cam: { rx: -25, ry: 0, tx: 0, ty: 0, zoom: 1 },
  nodes: [], // {id, x, y, z, phase, el}
  links: [], // {id, from, to, type, el}
  nextId: 1,
  selection: null,
  linkStart: null,
};

const COLORS = ['#ff6b6b','#48dbfb','#1dd1a1','#feca57','#ff9ff3','#54a0ff'];
const EL = {
  scene: document.getElementById('scene'),
  floor: document.getElementById('floor'),
  svg: document.getElementById('svg-layer'),
  inputPanel: document.getElementById('input-panel'),
  input: document.getElementById('memo-input'),
  hint: document.getElementById('hint')
};

// --- 星空生成 ---
(function(){
  const c = document.getElementById('stars');
  for(let i=0; i<80; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*2+1;
    s.style.width = sz+'px'; s.style.height = sz+'px';
    s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
    c.appendChild(s);
  }
})();

// --- ノード作成 ---
function createNode(text, x=0, y=0) {
  const id = S.nextId++;
  const wrap = document.createElement('div');
  wrap.className = 'memo-node';
  const card = document.createElement('div');
  card.className = 'memo-card';
  card.textContent = text;
  card.style.borderLeftColor = COLORS[id % COLORS.length];

  wrap.appendChild(card);
  EL.floor.appendChild(wrap);

  // 呼吸の「位相（ズレ）」をランダムに設定
  const node = { id, x, y, z: 0, phase: Math.random() * Math.PI * 2, el: wrap };
  S.nodes.push(node);

  wrap.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if (S.mode === 'move') {
      S.selection = id;
      wrap.setPointerCapture(e.pointerId);
      wrap.classList.add('selected');
    } else if (S.mode === 'link') {
      handleLink(id);
    }
  });
  return node;
}

// --- リンク処理（進化版） ---
function handleLink(id) {
  if (S.linkStart === null) {
    S.linkStart = id;
    S.nodes.find(n=>n.id===id).el.classList.add('link-waiting');
  } else {
    const from = S.linkStart, to = id;
    S.nodes.find(n=>n.id===from).el.classList.remove('link-waiting');
    S.linkStart = null;
    if (from !== to) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('class', 'link-line line-normal');

      // リンク自体をタップして「種類」を変える
      line.style.pointerEvents = 'stroke';
      line.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        cycleLinkType(line);
      });

      EL.svg.appendChild(line);
      S.links.push({ from, to, type: 'normal', el: line });
    }
  }
}

function cycleLinkType(line) {
  const types = ['line-normal', 'line-strong', 'line-conflict'];
  let current = 0;
  types.forEach((t, i) => { if(line.classList.contains(t)) current = i; });
  line.classList.remove(types[current]);
  line.classList.add(types[(current + 1) % types.length]);
}

// --- メインループ（呼吸アニメ & 描画更新） ---
let time = 0;
function tick() {
  time += 0.02;

  // 1. ノードの呼吸アニメーション
  S.nodes.forEach(n => {
    // Math.sinで上下にふわふわ（浮力）
    const driftY = Math.sin(time + n.phase) * 10;
    // box-shadowの明滅
    const glow = (Math.sin(time + n.phase) + 1) * 5;

    // ドラッグ中でなければアニメーション適用
    const zBase = (S.selection === n.id) ? 20 : n.z;
    n.el.style.transform = `translate3d(${n.x}px, ${n.y + driftY}px, ${zBase}px)`;
    n.el.querySelector('.memo-card').style.boxShadow = `0 ${4+glow}px ${15+glow}px rgba(0,0,0,0.5)`;
  });

  // 2. リンク線の位置更新
  if (S.links.length > 0) {
    const rects = {};
    S.nodes.forEach(n => {
      const r = n.el.getBoundingClientRect();
      rects[n.id] = { x: r.left + r.width/2, y: r.top + r.height/2 };
    });
    S.links.forEach(l => {
      const p1 = rects[l.from], p2 = rects[l.to];
      if (p1 && p2) {
        l.el.setAttribute('x1', p1.x); l.el.setAttribute('y1', p1.y);
        l.el.setAttribute('x2', p2.x); l.el.setAttribute('y2', p2.y);
      }
    });
  }
  requestAnimationFrame(tick);
}
tick();

// --- インタラクション（カメラ・移動） ---
let evCache = [];
let prevDiff = -1;
let lastP = {x:0, y:0};

window.addEventListener('pointerdown', e => {
  if (e.target.closest('#toolbar, #input-panel')) return;
  evCache.push(e);
  lastP = { x: e.clientX, y: e.clientY };
});

window.addEventListener('pointermove', e => {
  const idx = evCache.findIndex(ev => ev.pointerId === e.pointerId);
  if(idx > -1) evCache[idx] = e;

  if (evCache.length === 2) {
    // 2本指ズーム
    const curDiff = Math.hypot(evCache[0].clientX - evCache[1].clientX, evCache[0].clientY - evCache[1].clientY);
    if (prevDiff > 0) {
      S.cam.zoom = Math.max(0.2, Math.min(3, S.cam.zoom + (curDiff - prevDiff) * 0.005));
    }
    prevDiff = curDiff;
  } else if (evCache.length === 1) {
    const dx = e.clientX - lastP.x;
    const dy = e.clientY - lastP.y;

    if (S.selection) {
      // ノード移動
      const n = S.nodes.find(n => n.id === S.selection);
      const rad = -S.cam.ry * Math.PI / 180;
      n.x += (dx * Math.cos(rad) - dy * Math.sin(rad)) / S.cam.zoom;
      n.y += (dx * Math.sin(rad) + dy * Math.cos(rad)) / S.cam.zoom;
    } else {
      // カメラ回転
      S.cam.ry += dx * 0.5;
      S.cam.rx = Math.max(-80, Math.min(10, S.cam.rx - dy * 0.5));
    }
    lastP = { x: e.clientX, y: e.clientY };
  }
  updateCamera();
});

window.addEventListener('pointerup', e => {
  evCache = evCache.filter(ev => ev.pointerId !== e.pointerId);
  if (evCache.length < 2) prevDiff = -1;
  if (S.selection) {
    S.nodes.find(n => n.id === S.selection).el.classList.remove('selected');
    S.selection = null;
  }
});

function updateCamera() {
  EL.scene.style.transform = `translateX(${S.cam.tx}px) translateY(${S.cam.ty}px) scale(${S.cam.zoom}) rotateX(${S.cam.rx}deg) rotateY(${S.cam.ry}deg)`;
}

// --- UI操作 ---
document.querySelectorAll('.tool-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
    b.classList.add('active');
    S.mode = b.dataset.mode;
    EL.hint.textContent = b.textContent + ' モード';
    S.mode === 'create' ? EL.inputPanel.classList.add('show') : EL.inputPanel.classList.remove('show');
  });
});

document.getElementById('add-btn').addEventListener('click', () => {
  if (createNode(EL.input.value)) { EL.input.value = ''; EL.input.focus(); }
});

// 初期デモ
setTimeout(() => {
  createNode("脳みそ空間", 0, -50);
  createNode("呼吸するメモ", -100, 50);
  createNode("関係を定義", 100, 50);
}, 300);

</script>
</body>
</html>
