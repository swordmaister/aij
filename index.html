<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Anatomical Muscle Visualizer VR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 1;
        }
    </style>
    <!-- Import Map for modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        <h2>Muscle Structure VR Visualizer</h2>
        <p>Use VR controller Trigger to toggle outer layer transparency.</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import * as CANNON from 'cannon-es';

        // --- Global Variables ---
        let camera, scene, renderer;
        let world, timeStep = 1 / 60;
        let controllers = [], controllerGrips = [];

        // Physics Objects
        const physicsMeshes = [];
        const physicsBodies = [];
        let shoulderBody, armBody, armConstraint;

        // Muscle System
        const muscles = [];

        // UI & Interaction
        let raycaster;
        const tempMatrix = new THREE.Matrix4();
        let uiButton;
        let isOuterLayerVisible = true;

        class Muscle {
            constructor(scene, originBody, localOrigin, insertionBody, localInsertion, options) {
                this.originBody = originBody;
                this.localOrigin = localOrigin; // CANNON.Vec3
                this.insertionBody = insertionBody;
                this.localInsertion = localInsertion; // CANNON.Vec3

                this.options = options || {};
                this.color = this.options.color || 0xff0000;
                this.radius = this.options.radius || 0.05;
                this.name = this.options.name || 'Muscle';

                // Geometry
                const geometry = new THREE.CylinderGeometry(1, 1, 1, 16);

                // Material
                const material = new THREE.MeshPhongMaterial({
                    color: this.color,
                    transparent: true,
                    opacity: 0.9,
                    shininess: 100
                });

                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.castShadow = true;
                scene.add(this.mesh);

                // State
                this.initialLength = null;
            }

            update() {
                // Get World Positions
                const worldOrigin = this.originBody.pointToWorldFrame(this.localOrigin);
                const worldInsertion = this.insertionBody.pointToWorldFrame(this.localInsertion);

                // Distance
                const distance = worldOrigin.distanceTo(worldInsertion);

                // Position (Midpoint)
                const midpoint = worldOrigin.vadd(worldInsertion).scale(0.5);
                this.mesh.position.set(midpoint.x, midpoint.y, midpoint.z);

                // Orientation
                const direction = worldInsertion.vsub(worldOrigin);
                direction.normalize();

                // Quaternion: Rotate from Up (0,1,0) to Direction
                const quaternion = new THREE.Quaternion();
                quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(direction.x, direction.y, direction.z));
                this.mesh.quaternion.copy(quaternion);

                // Initialize length on first frame
                if (this.initialLength === null && distance > 0) this.initialLength = distance;

                // Scale (Bulging Logic)
                if (this.initialLength > 0) {
                    const stretch = distance / this.initialLength;
                    // Volume conservation: r ~ 1/sqrt(L) -> bulge ~ 1/sqrt(stretch)
                    const bulge = Math.sqrt(1 / Math.max(0.1, stretch));

                    this.mesh.scale.set(this.radius * bulge, distance, this.radius * bulge);
                }
            }
        }

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202020);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 1.5);

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; // Enable Shadows
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 4. VR Button
            document.body.appendChild(VRButton.createButton(renderer));

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true; // Cast Shadows
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);

            // 6. Physics World Setup
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;

            // Ground (Physics)
            const groundShape = new CANNON.Plane();
            const groundBody = new CANNON.Body({ mass: 0 });
            groundBody.addShape(groundShape);
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);

            // Ground (Visual)
            const floorGeo = new THREE.PlaneGeometry(10, 10);
            const floorMat = new THREE.MeshPhongMaterial({ color: 0x444444 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);

            // 7. Raycaster
            raycaster = new THREE.Raycaster();

            // --- Skeleton Setup ---
            createSkeleton();

            // --- Muscles Setup ---
            createMuscles();

            // --- UI Setup ---
            createUI();

            // 8. Controllers Setup
            setupControllers();

            // 9. Window Resize
            window.addEventListener('resize', onWindowResize);

            // 10. OrbitControls (Desktop Debugging)
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.5, 0);
            controls.update();
        }

        function createSkeleton() {
            const boneMat = new THREE.MeshPhongMaterial({ color: 0xcccccc, wireframe: false });

            // Shoulder
            const shoulderShape = new CANNON.Sphere(0.1);
            shoulderBody = new CANNON.Body({ mass: 0 });
            shoulderBody.addShape(shoulderShape);
            shoulderBody.position.set(0, 1.5, 0);
            world.addBody(shoulderBody);
            physicsBodies.push(shoulderBody);

            const shoulderMesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), boneMat);
            scene.add(shoulderMesh);
            physicsMeshes.push(shoulderMesh);

            // Arm
            const armLength = 0.4;
            const armShape = new CANNON.Box(new CANNON.Vec3(0.05, armLength / 2, 0.05));
            armBody = new CANNON.Body({ mass: 1 });
            armBody.addShape(armShape);
            armBody.position.set(0, 1.5 - armLength / 2, 0);
            world.addBody(armBody);
            physicsBodies.push(armBody);

            const armMesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, armLength, 0.1), boneMat);
            scene.add(armMesh);
            physicsMeshes.push(armMesh);

            // Joint
            armConstraint = new CANNON.HingeConstraint(shoulderBody, armBody, {
                pivotA: new CANNON.Vec3(0, 0, 0),
                pivotB: new CANNON.Vec3(0, armLength / 2, 0),
                axisA: new CANNON.Vec3(0, 0, 1),
                axisB: new CANNON.Vec3(0, 0, 1),
                collideConnected: false
            });
            armConstraint.enableMotor();
            armConstraint.setMotorSpeed(0);
            world.addConstraint(armConstraint);
        }

        function createMuscles() {
            // Supraspinatus
            const supraspinatus = new Muscle(
                scene,
                shoulderBody, new CANNON.Vec3(-0.15, 0.1, 0),
                armBody, new CANNON.Vec3(0, 0.15, 0),
                { color: 0xff6666, radius: 0.04, name: 'Supraspinatus' }
            );
            muscles.push(supraspinatus);

            // Deltoid
            const deltoid = new Muscle(
                scene,
                shoulderBody, new CANNON.Vec3(0, 0.15, 0),
                armBody, new CANNON.Vec3(0.06, 0.0, 0),
                { color: 0xaa0000, radius: 0.07, name: 'Deltoid' }
            );
            muscles.push(deltoid);
        }

        function createUI() {
            const uiGroup = new THREE.Group();
            // Move UI lower and slightly closer to not block the view of the shoulder (Y=1.5)
            uiGroup.position.set(0, 1.1, 0.8);
            uiGroup.rotation.x = -0.4; // Tilt up to face user
            scene.add(uiGroup);

            // Panel
            const panelGeo = new THREE.PlaneGeometry(0.4, 0.2);
            const panelMat = new THREE.MeshPhongMaterial({ color: 0x333333, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            const panel = new THREE.Mesh(panelGeo, panelMat);
            uiGroup.add(panel);

            // Button
            const buttonGeo = new THREE.BoxGeometry(0.2, 0.08, 0.02);
            const buttonMat = new THREE.MeshPhongMaterial({ color: 0x44aa44 });
            uiButton = new THREE.Mesh(buttonGeo, buttonMat);
            uiButton.position.z = 0.02;
            uiGroup.add(uiButton);
        }

        function setupControllers() {
            // Ray visual
            const geometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);
            const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0xffffff }));
            line.scale.z = 5;

            // Controller 1
            const controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.add(line.clone());
            scene.add(controller1);
            controllers.push(controller1);

            // Controller 2
            const controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            controller2.add(line.clone());
            scene.add(controller2);
            controllers.push(controller2);

            // Models
            const controllerModelFactory = new XRControllerModelFactory();
            const controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
            scene.add(controllerGrip1);
            controllerGrips.push(controllerGrip1);

            const controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
            scene.add(controllerGrip2);
            controllerGrips.push(controllerGrip2);
        }

        function onSelectStart(event) {
            const controller = event.target;

            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            const intersects = raycaster.intersectObject(uiButton);

            if (intersects.length > 0) {
                toggleLayer();
            }
        }

        function toggleLayer() {
            isOuterLayerVisible = !isOuterLayerVisible;
            const deltoid = muscles.find(m => m.name === 'Deltoid');
            if (deltoid) {
                deltoid.mesh.material.opacity = isOuterLayerVisible ? 0.9 : 0.2;
                uiButton.material.color.setHex(isOuterLayerVisible ? 0x44aa44 : 0xaa4444);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        let lastTime = 0;

        function render(timestamp) {
            if (!timestamp) timestamp = 0;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Physics Step: Fixed 60Hz step, catching up to real time
            // world.step(fixedTimeStep, timeSinceLastCalled, maxSubSteps)
            world.step(1/60, dt, 3);

            // Animation: Use real time (seconds)
            const seconds = timestamp / 1000;
            if (armConstraint) {
                armConstraint.enableMotor();
                armConstraint.setMotorSpeed(Math.cos(seconds * 2) * 2);
            }

            // Sync
            for (let i = 0; i < physicsMeshes.length; i++) {
                physicsMeshes[i].position.copy(physicsBodies[i].position);
                physicsMeshes[i].quaternion.copy(physicsBodies[i].quaternion);
            }

            muscles.forEach(m => m.update());

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
